<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />

    <title>Gerador de apostas bobas</title>

    <style>
      body {
        font-family: helvetica, sans-serif;
        width: 350px;
      }

      label {
        font-weight: bold;
      }

      div {
        padding-top: 20px;
      }

      input[type="text"] {
        padding: 5px;
        width: 150px;
      }

      p {
        background: #ffc125;
        color: #5e2612;
        padding: 10px;
        visibility: hidden;
      }
    </style>
  </head>

  <body>
    <h1>Gerador de apostas bobas de Flag Football</h1>
    <fieldset>
      <label for="customname">Insira o nome do jogador:</label>
      <input id="customname" type="text" placeholder="" />
    </fieldset>
    <fieldset>
      <legend>Posição do jogador:</legend>
      <label for="defesa">Defesa</label
      ><input id="defesa" type="radio" name="position" value="defesa" checked />
      <label for="ataque">Ataque</label
      ><input id="ataque" type="radio" name="position" value="ataque" />
    </fieldset>
    <fieldset>
      <legend>Valor da aposta em:</legend>
      <label for="reais">Reais</label
      ><input id="reais" type="radio" name="money" value="reais" checked />
      <label for="dolar">Dólar</label
      ><input id="dolar" type="radio" name="money" value="dolar" />
    </fieldset>
    <div>
      <button class="randomize">Crie uma aposta boba</button>
    </div>
    <p class="story"></p>
    <script src="main.js"></script>
  </body>
</html>
