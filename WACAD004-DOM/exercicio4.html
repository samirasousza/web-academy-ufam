<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
  </head>
  <body>
    <div id="app-tarefas">
      <h3>Minhas Tarefas</h3>

      <!-- Campo de digitação e botão de ação -->
      <input
        type="text"
        id="input-nova-tarefa"
        placeholder="Digite uma tarefa..."
      />
      <button id="btn-adicionar">Adicionar Tarefa</button>

      <!-- Lista onde as tarefas vão aparecer -->
      <ul id="lista-tarefas">
        <li>Revisar código da aula passada</li>
      </ul>
    </div>

    <script>
      const input = document.getElementById("input-nova-tarefa");
      const button = document.getElementById("btn-adicionar");
      const lista = document.getElementById("lista-tarefas");

      button.addEventListener("click", function () {
        const inputTexto = input.value.trim();

        if (inputTexto === "") {
          alert("Por favor, digite uma tarefa!");
          return;
        }

        const novoElemento = document.createElement("li");
        novoElemento.textContent = inputTexto;
        lista.appendChild(novoElemento);

        input.value = "";
      });
    </script>
  </body>
</html>
