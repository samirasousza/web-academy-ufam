<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container-fluid">
      <nav class="navbar navbar-dark bg-dark navbar-expand-lg fixed-top">
        <div
          class="container-fluid d-flex justify-content-between align-items-center"
        >
          <a class="navbar-brand" href="#">CineList</a>

          <div class="collapse navbar-collapse ms-auto" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a
                  class="nav-link"
                  data-bs-toggle="offcanvas"
                  href="#offcanvasMenu"
                  role="button"
                  >Menu</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <div class="my-5 mx-5">
        <h1 class="mb-4 pt-5 fw-bold">Gerenciar Catálogo</h1>

        <div class="d-flex justify-content-end mb-4">
          <button
            class="btn btn-md btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#adicionarFilmeModal"
          >
            Adicionar Filme
          </button>
        </div>

        <div class="rounded overflow-hidden">
          <table class="table">
            <thead class="table-dark">
              <tr>
                <th>Id</th>
                <th>Título</th>
                <th>Gênero</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>01</td>
                <td>O senhor dos anéis</td>
                <td>Fantasia</td>
                <td>
                  <span class="badge bg-success">Assistido</span>
                </td>
                <td>
                  <button class="btn btn-sm btn-outline-primary">Editar</button>
                  <button class="btn btn-sm btn-outline-danger">Excluir</button>
                </td>
              </tr>
              <tr>
                <td>02</td>
                <td>Interestelar</td>
                <td>Ficção Científica</td>
                <td>
                  <span class="badge bg-warning">Pendente</span>
                </td>
                <td>
                  <button class="btn btn-sm btn-outline-primary">Editar</button>
                  <button class="btn btn-sm btn-outline-danger">Excluir</button>
                </td>
              </tr>
              <tr>
                <td>03</td>
                <td>Matrix</td>
                <td>Ficção Científica</td>
                <td>
                  <span class="badge bg-success">Assistido</span>
                </td>
                <td>
                  <button class="btn btn-sm btn-outline-primary">Editar</button>
                  <button class="btn btn-sm btn-outline-danger">Excluir</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="modal" id="adicionarFilmeModal">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Adicionar Filme</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <form>
                  <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input
                      type="text"
                      class="form-control"
                      id="titulo"
                      placeholder="Digite o título do filme"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="genero" class="form-label">Gênero</label>
                    <input
                      type="text"
                      class="form-control"
                      id="genero"
                      placeholder="Digite o gênero do filme"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="ano" class="form-label">Ano</label>

                    <input
                      type="number"
                      class="form-control"
                      id="ano"
                      placeholder="Digite o ano do filme"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="resumo" class="form-label">Resumo</label>

                    <textarea
                      class="form-control"
                      id="resumo"
                      rows="4"
                      placeholder="Digite o resumo do filme"
                    ></textarea>
                  </div>
                  <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status">
                      <option value="">Selecione o status</option>
                      <option value="assistido">Assistido</option>
                      <option value="pendente">Pendente</option>
                      <option value="favorito">Favorito</option>
                    </select>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancelar
                </button>
                <button type="button" class="btn btn-primary">
                  Salvar Filme
                </button>
              </div>
            </div>
          </div>
        </div>

        <div
          class="offcanvas offcanvas-end text-bg-dark"
          tabindex="-1"
          id="offcanvasMenu"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title">CineList</h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>

          <div class="offcanvas-body p-0">
            <div class="list-group list-group-flush">
              <a
                href="#"
                class="list-group-item list-group-item-action bg-dark text-white border-secondary"
              >
                Dashboard
              </a>

              <a
                href="#"
                class="list-group-item list-group-item-action active"
                aria-current="true"
              >
                Catálogo de Filmes
              </a>

              <a
                href="#"
                class="list-group-item list-group-item-action bg-dark text-white border-secondary"
              >
                Gestão de Usuários
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
